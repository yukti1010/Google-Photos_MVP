<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Photos — MemoryLens AI MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Exact Modern Smartphone Aspect Ratio & Clean Bezel */
    .device-shell {
      width: min(390px, 100vw - 16px);
      height: min(844px, calc(100dvh - 120px));
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #171717;
    }
    @media (max-width: 440px) {
      .device-shell {
        width: 100vw;
        height: calc(100dvh - 90px);
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 flex flex-col items-center justify-between min-h-screen p-2 sm:p-4 font-sans select-none overflow-x-hidden">

  <!-- Top Controller Strip -->
  <header class="w-full max-w-[390px] flex items-center justify-between pb-2 px-2">
    <div>
      <h1 class="text-xs font-bold tracking-wider uppercase text-blue-400">MemoryLens AI</h1>
      <p id="screen-label" class="text-[11px] text-neutral-400">Step 1 · Memory Search</p>
    </div>

    <!-- Step Indicator Pills -->
    <nav class="flex gap-1.5 bg-neutral-900 p-1 rounded-full border border-neutral-800">
      <button onclick="setScreen(1)" id="pill-1" class="w-7 h-7 text-xs rounded-full font-bold transition bg-blue-600 text-white">1</button>
      <button onclick="setScreen(2)" id="pill-2" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">2</button>
      <button onclick="setScreen(3)" id="pill-3" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">3</button>
      <button onclick="setScreen(4)" id="pill-4" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">4</button>
      <button onclick="setScreen(5)" id="pill-5" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">5</button>
    </nav>
  </header>

  <!-- Phone Shell Loading Your Real Stitch Screens -->
  <main class="device-shell bg-black relative flex flex-col overflow-hidden">
    <!-- Dynamic Island Notch -->
    <div class="h-6 w-full bg-transparent flex justify-center items-center pt-2 absolute top-0 left-0 z-50 pointer-events-none">
      <div class="w-24 h-4 bg-black rounded-full"></div>
    </div>

    <!-- Iframe rendering your exact Stitch HTML files -->
    <iframe id="stitch-frame" src="Screen1.html" class="w-full h-full border-none bg-white" title="MemoryLens Screen"></iframe>
  </main>

  <!-- Bottom Fast-Nav Toolbar -->
  <footer class="w-full max-w-[390px] flex items-center justify-between pt-2 px-2 text-xs">
    <button onclick="prevScreen()" class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 hover:bg-neutral-800 active:scale-95 transition">
      ← Back
    </button>
    <span class="text-neutral-500 text-[11px]">Tap screen buttons or step numbers</span>
    <button onclick="nextScreen()" class="px-3.5 py-1.5 rounded-xl bg-blue-600 font-semibold text-white hover:bg-blue-500 active:scale-95 transition">
      Next →
    </button>
  </footer>

  <script>
    let currentStep = 1;
    const screens = {
      1: { file: 'Screen1.html', label: 'Step 1 · Memory Search' },
      2: { file: 'Screen2.html', label: 'Step 2 · Parsing Story' },
      3: { file: 'Screen3.html', label: 'Step 3 · Sensory Clarification' },
      4: { file: 'Screen4.html', label: 'Step 4 · Ranked Candidates' },
      5: { file: 'Screen5.html', label: 'Step 5 · Verified Memory' }
    };

    function setScreen(num) {
      if (num < 1 || num > 5) return;
      currentStep = num;
      const iframe = document.getElementById('stitch-frame');
      iframe.src = screens[num].file;
      document.getElementById('screen-label').textContent = screens[num].label;

      for (let i = 1; i <= 5; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if (pill) {
          pill.className = (i === num)
            ? "w-7 h-7 text-xs rounded-full font-bold transition bg-blue-600 text-white"
            : "w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white";
        }
      }
    }

    function nextScreen() { if (currentStep < 5) setScreen(currentStep + 1); }
    function prevScreen() { if (currentStep > 1) setScreen(currentStep - 1); }

    // Intercept clicks directly inside your Stitch screens so buttons navigate properly
    const frame = document.getElementById('stitch-frame');
    frame.onload = function() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;

        // Auto-scale content if needed
        const style = doc.createElement('style');
        style.textContent = `
          body { -webkit-font-smoothing: antialiased; }
          /* Ensure smooth scroll and hide ugly double scrollbars */
          ::-webkit-scrollbar { display: none; }
          * { -ms-overflow-style: none; scrollbar-width: none; }
        `;
        doc.head.appendChild(style);

        // Map every clickable button/link to its respective screen
        doc.querySelectorAll('button, a, [role="button"], div[onclick]').forEach(el => {
          const txt = (el.innerText || '').trim().toLowerCase();

          // Screen 1 -> Screen 2
          if (txt.includes('find this memory') || el.closest('#find-btn')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(2); };
          }
          // Screen 2 -> Screen 3
          else if (txt.includes('help me find it') || txt.includes('need one more clue') || txt.includes('clarify')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(3); };
          }
          // Screen 2 -> Screen 4 (Skip)
          else if (txt.includes('show all 142') || txt.includes('unclarified')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(4); };
          }
          // Screen 3 -> Screen 4
          else if (txt.includes('view 6') || txt.includes('ranked memories')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(4); };
          }
          // Screen 4 -> Screen 5
          else if (txt.includes('view memory') || txt.includes('inspect')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(5); };
          }
          // Screen 4 -> Screen 3 (Refine)
          else if (txt.includes('refine')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(3); };
          }
          // Screen 5 -> Screen 4 (Back)
          else if (txt.includes('back to candidates')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(4); };
          }
          // Screen 5 -> Screen 1 (Restart)
          else if (txt.includes('search another memory')) {
            el.style.cursor = 'pointer';
            el.onclick = (e) => { e.preventDefault(); setScreen(1); };
          }
        });
      } catch (err) {
        console.warn('Iframe binding note:', err);
      }
    };
  </script>
</body>
</html>
