<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Photos — MemoryLens AI MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* Fixed 375px x 812px chassis */
    .device-shell {
      width: 375px;
      height: 812px;
      border-radius: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 10px #1f2937;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    @media (max-width: 400px) {
      .device-shell {
        width: 100vw;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 flex flex-col items-center min-h-screen py-6 px-2 font-sans select-none overflow-y-auto">

  <!-- Top Controller Strip (375px) -->
  <header class="w-full max-w-[375px] flex items-center justify-between pb-3 px-1 mb-2">
    <div>
      <h1 class="text-xs font-bold tracking-wider uppercase text-blue-400">MemoryLens AI</h1>
      <p id="screen-label" class="text-[11px] text-neutral-400">Step 1 · Memory Search</p>
    </div>

    <!-- Step Indicator Pills -->
    <nav class="flex gap-1 bg-neutral-900 p-1 rounded-full border border-neutral-800" aria-label="Step Navigation">
      <button onclick="setScreen(1)" id="pill-1" class="w-7 h-7 text-xs rounded-full font-bold transition bg-blue-600 text-white">1</button>
      <button onclick="setScreen(2)" id="pill-2" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">2</button>
      <button onclick="setScreen(3)" id="pill-3" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">3</button>
      <button onclick="setScreen(4)" id="pill-4" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">4</button>
      <button onclick="setScreen(5)" id="pill-5" class="w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white">5</button>
    </nav>
  </header>

  <!-- Phone Shell (375px x 812px) -->
  <main class="device-shell">
    <!-- Top Notch / Island Indicator -->
    <div class="h-5 w-full bg-transparent flex justify-center items-center pt-1 absolute top-0 left-0 z-50 pointer-events-none">
      <div class="w-24 h-3.5 bg-black rounded-full"></div>
    </div>

    <!-- Active Screen Frame -->
    <iframe id="stitch-frame" src="Screen1.html" class="w-full h-full border-none bg-white" title="Screen Viewer"></iframe>

    <!-- NATIVE CLICKABLE TASKBAR OVERLAY (Guaranteed click response) -->
    <div class="absolute bottom-0 left-0 right-0 h-14 bg-white/95 backdrop-blur-md border-t border-neutral-200 z-50 flex items-center justify-around px-2 text-neutral-500">
      <button onclick="setScreen(1)" id="tab-photos" class="flex flex-col items-center justify-center flex-1 h-full text-blue-600 transition active:scale-90">
        <span class="material-symbols-outlined text-[20px]">photo_library</span>
        <span class="text-[9px] font-semibold mt-0.5">Photos</span>
      </button>
      <button onclick="setScreen(3)" id="tab-memories" class="flex flex-col items-center justify-center flex-1 h-full hover:text-blue-600 transition active:scale-90">
        <span class="material-symbols-outlined text-[20px]">filter_vintage</span>
        <span class="text-[9px] font-semibold mt-0.5">Memories</span>
      </button>
      <button onclick="setScreen(4)" id="tab-library" class="flex flex-col items-center justify-center flex-1 h-full hover:text-blue-600 transition active:scale-90">
        <span class="material-symbols-outlined text-[20px]">folder_shared</span>
        <span class="text-[9px] font-semibold mt-0.5">Library</span>
      </button>
      <button onclick="setScreen(1)" id="tab-search" class="flex flex-col items-center justify-center flex-1 h-full hover:text-blue-600 transition active:scale-90">
        <span class="material-symbols-outlined text-[20px]">search</span>
        <span class="text-[9px] font-semibold mt-0.5">Search</span>
      </button>
    </div>
  </main>

  <!-- Bottom Fast-Nav Toolbar -->
  <footer class="w-full max-w-[375px] flex items-center justify-between pt-3 px-1 mt-2 text-xs">
    <button onclick="prevScreen()" class="px-3.5 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 hover:bg-neutral-800 active:scale-95 transition">
      ← Back
    </button>
    <span class="text-neutral-500 text-[11px]">Use bottom tabs or screen buttons</span>
    <button onclick="nextScreen()" class="px-3.5 py-1.5 rounded-xl bg-blue-600 font-semibold text-white hover:bg-blue-500 active:scale-95 transition">
      Next →
    </button>
  </footer>

  <script>
    let currentStep = 1;
    const screens = {
      1: { file: 'Screen1.html', label: 'Step 1 · Memory Search' },
      2: { file: 'Screen2.html', label: 'Step 2 · Parsing Story' },
      3: { file: 'Screen3.html', label: 'Step 3 · Sensory Clarification' },
      4: { file: 'Screen4.html', label: 'Step 4 · Ranked Candidates' },
      5: { file: 'Screen5.html', label: 'Step 5 · Verified Memory' }
    };

    function setScreen(num) {
      if (num < 1 || num > 5) return;
      currentStep = num;
      const iframe = document.getElementById('stitch-frame');
      iframe.src = screens[num].file;
      document.getElementById('screen-label').textContent = screens[num].label;

      // Update pills
      for (let i = 1; i <= 5; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if (pill) {
          pill.className = (i === num)
            ? "w-7 h-7 text-xs rounded-full font-bold transition bg-blue-600 text-white"
            : "w-7 h-7 text-xs rounded-full font-medium transition text-neutral-400 hover:text-white";
        }
      }

      // Update taskbar active styling
      const tabs = { 1: 'tab-photos', 3: 'tab-memories', 4: 'tab-library' };
      ['tab-photos', 'tab-memories', 'tab-library', 'tab-search'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = "flex flex-col items-center justify-center flex-1 h-full text-neutral-400 hover:text-neutral-700 transition active:scale-90";
      });
      const activeTabId = tabs[num] || (num === 2 ? 'tab-photos' : 'tab-photos');
      const activeTab = document.getElementById(activeTabId);
      if (activeTab) activeTab.className = "flex flex-col items-center justify-center flex-1 h-full text-blue-600 font-bold transition active:scale-90";
    }

    function nextScreen() { if (currentStep < 5) setScreen(currentStep + 1); }
    function prevScreen() { if (currentStep > 1) setScreen(currentStep - 1); }

    const frame = document.getElementById('stitch-frame');
    frame.onload = function() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;

        // Hide iframe's internal bottom bar and double scrollbars so our overlay is clean
        const style = doc.createElement('style');
        style.textContent = `
          ::-webkit-scrollbar { display: none !important; }
          * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
          footer, nav[class*="fixed bottom"], div[class*="fixed bottom-0"] {
            display: none !important;
          }
          body {
            padding-bottom: 60px !important;
          }
        `;
        doc.head.appendChild(style);

        // Bind in-page buttons accurately (checking leaf targets, not parent wrappers)
        doc.addEventListener('click', function(e) {
          const btn = e.target.closest('button, a, [role="button"]');
          if (!btn) return;
          const txt = (btn.innerText || btn.textContent || '').trim().toLowerCase();

          if (txt.includes('find this memory')) {
            e.preventDefault(); e.stopPropagation(); setScreen(2);
          } else if (txt.includes('help me find it') || txt.includes('need one more clue') || txt.includes('clarify')) {
            e.preventDefault(); e.stopPropagation(); setScreen(3);
          } else if (txt.includes('show all 142') || txt.includes('unclarified')) {
            e.preventDefault(); e.stopPropagation(); setScreen(4);
          } else if (txt.includes('view 6') || txt.includes('ranked memories')) {
            e.preventDefault(); e.stopPropagation(); setScreen(4);
          } else if (txt.includes('view memory') || txt.includes('inspect')) {
            e.preventDefault(); e.stopPropagation(); setScreen(5);
          } else if (txt.includes('refine')) {
            e.preventDefault(); e.stopPropagation(); setScreen(3);
          } else if (txt.includes('back to candidates')) {
            e.preventDefault(); e.stopPropagation(); setScreen(4);
          } else if (txt.includes('search another memory')) {
            e.preventDefault(); e.stopPropagation(); setScreen(1);
          }
        }, true);

      } catch (err) {
        console.warn('Iframe notice:', err);
      }
    };
  </script>
</body>
</html>
